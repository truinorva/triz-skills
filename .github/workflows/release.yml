name: Package Skills

# Skill ZIPs are never stored in the repository. They are built from the Skill
# folders on demand and published as GitHub Release assets, so the repo keeps
# exactly one copy of every Skill: the editable folder. The same run checks the
# plugin marketplace that Claude Code and ChatGPT install from.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and validate Skill packages
    runs-on: ubuntu-latest
    permissions:
      # Only the release step needs write access; it is gated on a tag below.
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the plugins and build every Skill package
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          # On a release tag, every plugin.json must carry the tag's version:
          # Claude Code keeps users on a plugin's version until it changes.
          if [[ "$REF" == refs/tags/v* ]]; then
            python scripts/build_skills.py --out dist --expect-version "${TAG#v}"
          else
            python scripts/build_skills.py --out dist
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate the manifests with Claude Code
        env:
          # plugin validate needs no login; this keeps the CLI from phoning home.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: |
          # Claude Code's own schema check, on top of build_skills.py. Pinned so
          # a new release cannot change the verdict without a commit here.
          npm install --global --no-audit --no-fund @anthropic-ai/claude-code@2.1.302
          claude plugin validate --strict .
          claude plugin validate --strict ./technical-triz
          claude plugin validate --strict ./business-triz

      - name: Upload packages as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: triz-skills-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create the release if the tag does not have one yet, then upload
          # (--clobber keeps a re-run of the same tag idempotent).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
