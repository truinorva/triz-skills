name: Package Skills

# Skill ZIPs are never stored in the repository. They are built from the Skill
# folders on demand and published as GitHub Release assets, so the repo keeps
# exactly one copy of every Skill: the editable folder.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build and validate Skill packages
    runs-on: ubuntu-latest
    permissions:
      # Only the release step needs write access; it is gated on a tag below.
      contents: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build every Skill package
        run: python scripts/build_skills.py --out dist --bundle

      - name: Upload packages as a workflow artefact
        uses: actions/upload-artifact@v4
        with:
          name: triz-skills-packages
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Attach packages to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # Create the release if the tag does not have one yet, then upload
          # (--clobber keeps a re-run of the same tag idempotent).
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
